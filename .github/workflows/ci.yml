name: Python Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instal dependensi
        run: python -m pip install -r requirements.txt

      - name: Jalankan test
        run: python -m pytest tests/ -v

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Jalankan Semgrep
        run: semgrep scan --config p/python --error --verbose
